spring.application.name=analytics-service
server.port=8084

# Its own database (created on first start in development)
spring.datasource.url=jdbc:postgresql://localhost:5432/analytics_db
spring.datasource.username=ridex
spring.datasource.password=${DB_PASSWORD}
ridex.database.auto-create=true
spring.flyway.locations=classpath:db/migration,classpath:db/platform
# This service only READS events: nothing to publish, so no outbox relay
ridex.outbox.enabled=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
ridex.kafka.max-attempts=4
ridex.kafka.retry-initial-ms=500
ridex.kafka.retry-multiplier=2.0
ridex.kafka.retry-max-ms=8000

ridex.security.jwks-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
ridex.jwt.issuer=ridex

# One-time copy of the old audit log, daily counts and dead letters from the core's database
ridex.legacy.import-url=${LEGACY_DB_URL:}
ridex.legacy.import-user=${LEGACY_DB_USER:ridex}
ridex.legacy.import-password=${DB_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Phase 8: every log line carries the gateway correlation id (see RequestIdFilter)
logging.pattern.level=%5p [%X{requestId:-}]
