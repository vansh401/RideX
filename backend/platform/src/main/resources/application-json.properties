# Phase 12: profile "json" = one JSON object per log line (Elastic Common Schema), for log systems to index. Switch it on with
# SPRING_PROFILES_ACTIVE=json (Docker Compose and Kubernetes do). The fields of the logging context (requestId, userId, rideId, traceId,
# spanId, eventId ...) become fields of the object. Without the profile you get readable text for development.
logging.structured.format.console=ecs
