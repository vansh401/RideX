spring.application.name=notification-service
server.port=8081

# Its own database (created on first start in development)
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=ridex
spring.datasource.password=${DB_PASSWORD}
ridex.database.auto-create=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Service migrations, plus the platform library's event tables (outbox, processed events)
spring.flyway.locations=classpath:db/migration,classpath:db/platform

# Redis: the shared revocation list (read only) and the channel the core's WebSocket server listens to
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
ridex.realtime.push.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
ridex.kafka.max-attempts=4
ridex.kafka.retry-initial-ms=500
ridex.kafka.retry-multiplier=2.0
ridex.kafka.retry-max-ms=8000

# Tokens are issued by the core application; this service only VERIFIES them with the core's public key
ridex.security.jwks-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
ridex.jwt.issuer=ridex

# One-time copy of the old notifications table from the core's database (see LegacyNotificationImporter)
ridex.legacy.import-url=${LEGACY_DB_URL:}
ridex.legacy.import-user=${LEGACY_DB_USER:ridex}
ridex.legacy.import-password=${DB_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
