spring.application.name=pricing-service
server.port=8083

ridex.security.jwks-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
ridex.jwt.issuer=ridex
# Shared by the core and this service for internal calls (X-Service-Token). Blank = internal calls are impossible.
ridex.internal.service-token=${SERVICE_TOKEN:}

# Stateless: no database, no Kafka. (The shared platform library brings those libraries along, so switch their auto-configuration off.)
# Redis stays: it holds the revocation list, so a logged-out token is refused here too.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,
  org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration,
  org.springframework.boot.jdbc.autoconfigure.JdbcClientAutoConfiguration,
  org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration,
  org.springframework.boot.jdbc.autoconfigure.metrics.DataSourcePoolMetricsAutoConfiguration,
  org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration,
  org.springframework.boot.kafka.autoconfigure.metrics.KafkaMetricsAutoConfiguration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,prometheus

ridex.pricing.tax-rate=0.05
ridex.pricing.road-factor=1.30
ridex.pricing.categories.BIKE.base-fare=20.00
ridex.pricing.categories.BIKE.per-km=7.00
ridex.pricing.categories.BIKE.per-minute=1.00
ridex.pricing.categories.BIKE.minimum-fare=35.00
ridex.pricing.categories.BIKE.average-speed-kmh=25
ridex.pricing.categories.AUTO.base-fare=30.00
ridex.pricing.categories.AUTO.per-km=11.00
ridex.pricing.categories.AUTO.per-minute=1.50
ridex.pricing.categories.AUTO.minimum-fare=50.00
ridex.pricing.categories.AUTO.average-speed-kmh=22
ridex.pricing.categories.CAB.base-fare=50.00
ridex.pricing.categories.CAB.per-km=14.00
ridex.pricing.categories.CAB.per-minute=2.00
ridex.pricing.categories.CAB.minimum-fare=90.00
ridex.pricing.categories.CAB.average-speed-kmh=24

# Phase 8: every log line carries the gateway correlation id (see RequestIdFilter)
logging.pattern.level=%5p [req=%X{requestId:-} trace=%X{traceId:-} user=%X{userId:-} ride=%X{rideId:-}]

# Phase 10 (Kubernetes): /actuator/health/liveness ("am I stuck? restart me") and /actuator/health/readiness ("send me traffic?").
# They report the application's own state only, never its dependencies, so a database blip cannot make Kubernetes restart every pod.
management.endpoint.health.probes.enabled=true
# On a stop signal: finish the requests in progress (up to 25 s) before exiting, so a rolling update drops no request.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Phase 12 (observability)
# Metrics: every metric carries the name of the service, so one Prometheus can tell them apart.
management.metrics.tags.application=${spring.application.name}
# Latency as histogram buckets (not just an average), so Prometheus can compute percentiles across all copies of a service.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s
# Traces: the id is created for every request (and put in the logs); only this share of requests is also SENT to the trace backend.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Events published by the outbox relay and read by consumers continue the trace of the request that caused them.
spring.kafka.listener.observation-enabled=true
# Metrics are PULLED by Prometheus; do not also push them over OTLP (the starter turns that on and it would fail every minute).
management.otlp.metrics.export.enabled=false
# Spring Security adds four spans to every request ("filterchain before/after" ...): useful once, noise afterwards.
management.observations.enable.spring.security=false
# A @Scheduled method that runs every half second (the outbox relay) would create a trace per run.
management.observations.enable.tasks.scheduled.execution=false
