# RideX API gateway: the ONE address the browser talks to.
#
# Reading guide. A ROUTE has three parts:
#   predicates  "does this request belong to me?"        (here: the path)
#   uri         "which service do I forward it to?"
#   filters     "what do I do to the request/response on the way?" (here: rate limiting)
# The first matching route (lowest order) wins, so specific routes come before the catch-all.

server:
  port: 8000
  # On a stop signal finish the requests in progress before exiting (rolling updates drop none)
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 25s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Phase 12: a span per proxied request, and the trace context is passed on to the service (one trace covers gateway + service)
          observability:
            enabled: true
          metrics:
            enabled: true
          # X-Forwarded-For tells services the real address of the caller. for-append=false REPLACES whatever the client sent instead of
          # adding to it: a client could otherwise pretend to be someone else by writing its own value there.
          # Spring Cloud Gateway's own X-Forwarded-* handling is replaced by ClientAddressHeadersFilter, which does one simple thing:
          # X-Forwarded-For = the real address of the connection, whatever the client wrote.
          x-forwarded:
            enabled: false
          # Never wait for ever on a service. Without a response timeout a hung service holds the caller's connection open until the
          # browser gives up. A late answer becomes a clear 504 instead.
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:15s}
          # Default filters were given up on purpose: every route says explicitly what it does.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,X-Request-Id
                exposed-headers: X-Request-Id,Retry-After,X-RateLimit-Remaining
                allow-credentials: false   # tokens travel in a header, never in cookies
                max-age: 3600
          routes:
            # ---- sign in / sign up: the strictest limit (password guessing, e-mail sending) ----
            - id: core-auth
              uri: ${CORE_URL:http://localhost:8080}
              order: 10
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_RATE:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_BURST:15}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientAddressKeyResolver}"

            # ---- services that were extracted in Phase 7 ----
            - id: notification-service
              uri: ${NOTIFICATION_URL:http://localhost:8081}
              order: 20
              predicates:
                - Path=/api/notifications/**
              filters: &general-limit
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_BURST:60}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientAddressKeyResolver}"

            - id: payment-service
              uri: ${PAYMENT_URL:http://localhost:8082}
              order: 20
              predicates:
                - Path=/api/payments/**,/api/admin/payments/**
              filters: *general-limit

            - id: pricing-service
              uri: ${PRICING_URL:http://localhost:8083}
              order: 20
              predicates:
                - Path=/api/fares/**
              filters: *general-limit

            - id: analytics-service
              uri: ${ANALYTICS_URL:http://localhost:8084}
              order: 20
              predicates:
                - Path=/api/admin/events/**,/api/admin/analytics/**
              filters: *general-limit

            # ---- live updates. A WebSocket is an HTTP request that upgrades itself, hence the ws:// scheme ----
            # No rate limit here: it is one long connection. The token is checked inside the STOMP CONNECT frame by the core,
            # because a browser cannot add a header to a WebSocket handshake (see docs/gateway-concepts.md).
            - id: core-websocket
              uri: ${CORE_WS_URL:ws://localhost:8080}
              order: 30
              predicates:
                - Path=/ws/**

            # ---- everything else belongs to the core (rides, drivers, users, ratings, admin lists...) ----
            - id: core
              uri: ${CORE_URL:http://localhost:8080}
              order: 1000
              predicates:
                - Path=/**
              filters: *general-limit

ridex:
  gateway:
    # Where tokens are verified. In normal operation the core's public-key endpoint; keys can rotate without touching the gateway.
    jwks-uri: ${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    issuer: ridex
    # Proxies we run in front of the gateway, as a regular expression on their address. Only connections from these may say who the
    # real client is (X-Forwarded-For). Empty = nobody. Docker Compose sets it to the private network ranges (the nginx container).
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
    # Paths that need no token. Everything else needs a valid one. (method "*" = any)
    public-paths:
      - "*:/api/auth/**"
      - "GET:/api/health"
      - "GET:/.well-known/**"
      - "*:/ws/**"
      - "GET:/v3/api-docs/**"
      - "GET:/swagger-ui/**"
      - "GET:/swagger-ui.html"
      - "GET:/actuator/health/**"
      - "GET:/actuator/prometheus"   # scraped by Prometheus inside the network; the ingress never routes /actuator, so it is not reachable from outside
    # Paths that exist inside the platform and must never be reachable from outside
    blocked-paths:
      - "/internal/**"
      - "/mock-gateway/**"
      - "/actuator/**"       # except health, which public-paths lists and the check below allows

    # What GET /gateway/services (admin only) asks, to show which services are alive
    services:
      - { name: core, health-url: "${CORE_URL:http://localhost:8080}/api/health" }
      - { name: notification, health-url: "${NOTIFICATION_URL:http://localhost:8081}/actuator/health" }
      - { name: payment, health-url: "${PAYMENT_URL:http://localhost:8082}/actuator/health" }
      - { name: pricing, health-url: "${PRICING_URL:http://localhost:8083}/actuator/health" }
      - { name: analytics, health-url: "${ANALYTICS_URL:http://localhost:8084}/actuator/health" }

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Phase 12 (observability)
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s
  # Traces: the id is created for every request (and put in the logs); only this share of requests is also SENT to the trace backend.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Metrics are PULLED by Prometheus; do not also push them over OTLP (the starter turns that on and it would fail every minute).
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
