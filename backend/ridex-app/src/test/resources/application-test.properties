# Settings used only by tests (activated with @ActiveProfiles("test")).
# Nothing here is a real secret.

ridex.jwt.secret=test-only-secret-that-is-at-least-32-bytes-long-0123456789

# Background job off: tests call the dispatch logic directly so they stay deterministic
ridex.matching.scheduler.enabled=false

# Uploads go to a throwaway folder
ridex.storage.dir=${java.io.tmpdir}/ridex-test-uploads

# Nothing listens for mail in tests: fail fast instead of waiting
spring.jpa.properties.hibernate.generate_statistics=true
spring.mail.host=localhost
spring.mail.port=1
spring.mail.properties.mail.smtp.connectiontimeout=200
spring.mail.properties.mail.smtp.timeout=200

# Hundreds of tests log in from the same address within a minute, and some assert fresh numbers, so
# rate limiting and caching are OFF by default in tests. The tests that cover them switch them on.
ridex.rate-limit.enabled=false
ridex.cache.enabled=false
