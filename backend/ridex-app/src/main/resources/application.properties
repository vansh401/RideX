spring.application.name=ridex-app
server.port=8080

# Behind the API gateway every request comes from the gateway's address. The gateway puts the REAL client address in
# X-Forwarded-For; "native" lets Tomcat use it, but ONLY when the request comes from an internal address (loopback and private
# ranges by default), so a client reaching the core directly cannot choose its own address. In production, narrow it with
# server.tomcat.remoteip.internal-proxies=<the gateway's address>. Without this, all users would share one rate-limit bucket.
server.forward-headers-strategy=native

# The core has its own JSON error handler (it predates the shared platform library), so the shared one stays off
ridex.platform.web-errors.enabled=false

# Where the database is, and who we log in as
spring.datasource.url=jdbc:postgresql://localhost:5432/ridex_db
spring.datasource.username=ridex
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: access tokens are signed with an RSA private key (RS256) that never leaves this application. Other services verify
# them with the PUBLIC key from /.well-known/jwks.json. The key lives in this file (created on first start, git-ignored).
ridex.jwt.key-file=./data/keys/jwt-signing-key.pem
ridex.jwt.issuer=ridex
ridex.jwt.access-token-ttl-minutes=15
ridex.jwt.refresh-token-ttl-days=7

# Email (development: Mailpit catches everything on localhost:1025)
spring.mail.host=localhost
spring.mail.port=1025
ridex.mail.from=no-reply@ridex.local

# Where the React app lives (used to build links inside emails)
ridex.frontend.base-url=http://localhost:5173

# Redis (tokens, OTPs, cache, driver locations, locks, rate limits)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Email verification: a link (token) or a 6-digit code (OTP). Both live in Redis and expire by themselves.
ridex.verification.token-ttl-minutes=15
ridex.verification.otp-ttl-minutes=10
ridex.verification.otp-max-attempts=5

# Password reset links
ridex.password-reset.token-ttl-minutes=30


# First admin, created at startup only if no admin exists yet.
# Both ADMIN_EMAIL and ADMIN_PASSWORD (8-72 chars, a letter and a digit) must be set as
# environment variables. Never put the real values in this file.
ridex.admin.email=${ADMIN_EMAIL:}
ridex.admin.password=${ADMIN_PASSWORD:}
ridex.admin.full-name=${ADMIN_FULL_NAME:RideX Admin}
ridex.admin.phone=${ADMIN_PHONE:+910000000000}


# API docs (Swagger UI at /swagger-ui.html). Turn both off in production.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true


# File uploads: where files are stored, and the size limits (documents are small images/PDFs)
ridex.storage.dir=./data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# Pricing is a separate service (amounts in INR are configured THERE). The core asks it for a quote over REST.
ridex.pricing.base-url=${PRICING_URL:http://localhost:8083}
ridex.pricing.service-token=${SERVICE_TOKEN:}
ridex.pricing.connect-timeout-ms=500
ridex.pricing.read-timeout-ms=2000
ridex.pricing.retry-max-attempts=2
ridex.pricing.retry-wait-ms=200
ridex.pricing.circuit-window=10
ridex.pricing.circuit-min-calls=5
ridex.pricing.circuit-failure-rate=50
ridex.pricing.circuit-open-ms=10000
ridex.pricing.tax-rate=0.05
ridex.pricing.road-factor=1.30
ridex.pricing.categories.BIKE.base-fare=20.00
ridex.pricing.categories.BIKE.per-km=7.00
ridex.pricing.categories.BIKE.per-minute=1.00
ridex.pricing.categories.BIKE.minimum-fare=35.00
ridex.pricing.categories.BIKE.average-speed-kmh=25
ridex.pricing.categories.AUTO.base-fare=30.00
ridex.pricing.categories.AUTO.per-km=11.00
ridex.pricing.categories.AUTO.per-minute=1.50
ridex.pricing.categories.AUTO.minimum-fare=50.00
ridex.pricing.categories.AUTO.average-speed-kmh=22
ridex.pricing.categories.CAB.base-fare=50.00
ridex.pricing.categories.CAB.per-km=14.00
ridex.pricing.categories.CAB.per-minute=2.00
ridex.pricing.categories.CAB.minimum-fare=90.00
ridex.pricing.categories.CAB.average-speed-kmh=24


# Driver matching / dispatch
ridex.matching.radius-km=5
ridex.matching.offer-timeout-seconds=30
ridex.matching.search-timeout-seconds=120
ridex.matching.location-freshness-seconds=90
# How many of the nearest drivers (from Redis GEO) are tried, in order, for one ride
ridex.matching.candidate-limit=20
# A driver being assigned is locked in Redis for at most this long (safety net if a server dies)
ridex.matching.assignment-lock-seconds=15
ridex.matching.scheduler.enabled=true
ridex.matching.scheduler.interval-ms=5000


# Caching (Redis). Turn off with ridex.cache.enabled=false
ridex.cache.enabled=true
ridex.cache.admin-stats-ttl-seconds=15
ridex.cache.rider-profile-ttl-minutes=10

# Rate limiting (Redis counters). Per client IP. Limits are per window.
ridex.rate-limit.enabled=true
# every /api/auth/** call
ridex.rate-limit.auth-limit=30
ridex.rate-limit.auth-window-seconds=60
# register, forgot-password, resend-verification: the ones that send email
ridex.rate-limit.sensitive-limit=5
ridex.rate-limit.sensitive-window-seconds=3600
# all other /api/** calls
ridex.rate-limit.api-limit=600
ridex.rate-limit.api-window-seconds=60
# brute force: wrong passwords for one email from one IP, then a lockout
ridex.rate-limit.login-max-failures=5
ridex.rate-limit.login-lockout-minutes=15

# WebSocket (live updates). Only these pages may open a socket.
ridex.websocket.allowed-origins=http://localhost:5173,http://localhost:8080
ridex.websocket.heartbeat-ms=10000
ridex.websocket.location-updates-per10-seconds=20

# Kafka (events between modules). One broker in development.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
# Producer: wait for the broker to confirm, and never write the same message twice on a retry
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
# Consumers: a brand new group starts from the beginning, and offsets are committed after each message is handled
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Outbox: events are saved with the business change, then a relay copies them to Kafka
ridex.outbox.enabled=true
ridex.outbox.poll-interval-ms=500
ridex.outbox.batch-size=100
# How many times a failing message is tried (with growing pauses) before it goes to the dead-letter topic
ridex.kafka.max-attempts=4
ridex.kafka.retry-initial-ms=500
ridex.kafka.retry-multiplier=2.0
ridex.kafka.retry-max-ms=8000


# Phase 8: every log line carries the gateway correlation id (see RequestIdFilter)
logging.pattern.level=%5p [%X{requestId:-}]

# Phase 10 (Kubernetes): /actuator/health/liveness ("am I stuck? restart me") and /actuator/health/readiness ("send me traffic?").
# They report the application's own state only, never its dependencies, so a database blip cannot make Kubernetes restart every pod.
management.endpoint.health.probes.enabled=true
# On a stop signal: finish the requests in progress (up to 25 s) before exiting, so a rolling update drops no request.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
management.endpoints.web.exposure.include=health,info
