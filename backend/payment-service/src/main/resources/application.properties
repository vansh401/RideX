spring.application.name=payment-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=ridex
spring.datasource.password=${DB_PASSWORD}
ridex.database.auto-create=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/platform
# The platform library numbers its own tables 1000+, so a service that adds V2 later finds a database that is already past V2.
# Out-of-order lets Flyway apply that V2 (and fresh databases are unaffected: they run V1, V2, V1000 in order).
spring.flyway.out-of-order=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
ridex.outbox.enabled=true
ridex.outbox.poll-interval-ms=500
ridex.kafka.max-attempts=4
ridex.kafka.retry-initial-ms=500
ridex.kafka.retry-multiplier=2.0
ridex.kafka.retry-max-ms=8000

ridex.security.jwks-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
ridex.jwt.issuer=ridex

# The payment gateway is a REMOTE system. Every call to it is protected by Resilience4j: a timeout, retries, a circuit
# breaker and a bulkhead (see HttpPaymentGateway). In development the "remote" gateway is the mock inside this service.
ridex.payments.gateway.base-url=http://localhost:8082/mock-gateway
ridex.payments.gateway.connect-timeout-ms=500
ridex.payments.gateway.read-timeout-ms=1500
ridex.payments.gateway.retry-max-attempts=3
ridex.payments.gateway.retry-wait-ms=200
ridex.payments.gateway.circuit-window=10
ridex.payments.gateway.circuit-min-calls=5
ridex.payments.gateway.circuit-failure-rate=50
ridex.payments.gateway.circuit-open-ms=10000
ridex.payments.gateway.circuit-half-open-calls=2
ridex.payments.gateway.bulkhead-max-concurrent=5
# When the gateway does not answer, the payment stays PENDING and is tried again. After this many outages it FAILS.
ridex.payments.gateway.max-outages=5
ridex.payments.gateway.outage-backoff-ms=5000
ridex.payments.retry-interval-ms=3000
# The mock gateway declines a charge above this amount (so failures can be tried)
ridex.payments.mock.decline-above-amount=5000

ridex.legacy.import-url=${LEGACY_DB_URL:}
ridex.legacy.import-user=${LEGACY_DB_USER:ridex}
ridex.legacy.import-password=${DB_PASSWORD:}

management.endpoints.web.exposure.include=health,info,prometheus

# Phase 8: every log line carries the gateway correlation id (see RequestIdFilter)
logging.pattern.level=%5p [req=%X{requestId:-} trace=%X{traceId:-} user=%X{userId:-} ride=%X{rideId:-}]

# Phase 10 (Kubernetes): /actuator/health/liveness ("am I stuck? restart me") and /actuator/health/readiness ("send me traffic?").
# They report the application's own state only, never its dependencies, so a database blip cannot make Kubernetes restart every pod.
management.endpoint.health.probes.enabled=true
# On a stop signal: finish the requests in progress (up to 25 s) before exiting, so a rolling update drops no request.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Phase 12 (observability)
# Metrics: every metric carries the name of the service, so one Prometheus can tell them apart.
management.metrics.tags.application=${spring.application.name}
# Latency as histogram buckets (not just an average), so Prometheus can compute percentiles across all copies of a service.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s
# Traces: the id is created for every request (and put in the logs); only this share of requests is also SENT to the trace backend.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Events published by the outbox relay and read by consumers continue the trace of the request that caused them.
spring.kafka.listener.observation-enabled=true
# Metrics are PULLED by Prometheus; do not also push them over OTLP (the starter turns that on and it would fail every minute).
management.otlp.metrics.export.enabled=false
# Spring Security adds four spans to every request ("filterchain before/after" ...): useful once, noise afterwards.
management.observations.enable.spring.security=false
# A @Scheduled method that runs every half second (the outbox relay) would create a trace per run.
management.observations.enable.tasks.scheduled.execution=false

# Phase 14 (money)
# The company keeps this share of every fare; the driver gets the rest (see PaymentService.ridePaymentLegs).
ridex.payments.commission-rate=0.20
# Wallet limits
ridex.payments.wallet.min-top-up=10
ridex.payments.wallet.max-top-up=10000
ridex.payments.wallet.max-balance=50000
# "Today" for driver earnings and incentives means this time zone
ridex.payments.zone=Asia/Kolkata
# Daily bonus tiers: trips:bonus. The highest tier reached pays.
ridex.payments.incentives.tiers=10:100,20:250

# Phase 15
# Online payments. With no key the TEST checkout is used (no real money). Razorpay's free test mode gives you rzp_test_ keys.
ridex.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
ridex.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
ridex.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
ridex.payments.cancellation-fee=30
ridex.payments.referral-reward=50
ridex.payments.payout.minimum=100
