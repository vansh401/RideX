# Tests start their own containers (see PaymentTestBase); nothing here is a real secret.
ridex.database.auto-create=false
ridex.security.jwks-uri=
ridex.legacy.import-url=
ridex.kafka.max-attempts=3
ridex.kafka.retry-initial-ms=50
ridex.kafka.retry-max-ms=200
spring.kafka.listener.concurrency=1
# Fast settings so the protections can be watched working in seconds
ridex.payments.gateway.connect-timeout-ms=300
ridex.payments.gateway.read-timeout-ms=500
ridex.payments.gateway.retry-max-attempts=2
ridex.payments.gateway.retry-wait-ms=20
ridex.payments.gateway.circuit-window=6
ridex.payments.gateway.circuit-min-calls=4
ridex.payments.gateway.circuit-failure-rate=50
ridex.payments.gateway.circuit-open-ms=1500
ridex.payments.gateway.circuit-half-open-calls=1
ridex.payments.gateway.bulkhead-max-concurrent=2
ridex.payments.gateway.max-outages=3
ridex.payments.gateway.outage-backoff-ms=300
ridex.payments.retry-interval-ms=200
