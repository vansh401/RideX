# Prometheus: PULLS metrics. Every 15 seconds it asks each service for /actuator/prometheus (plain text, one line per measurement),
# stores the numbers with a timestamp, and evaluates the alert rules over them.
#
# Service names are Docker Compose DNS names (core, gateway ...). On Kubernetes the targets would come from service discovery instead
# (a ServiceMonitor or pod annotations); the metrics and the rules stay the same.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ridex
    metrics_path: /actuator/prometheus
    # The services label their own metrics with application=<name> (management.metrics.tags.application). The same label is put on the
    # target so that Prometheus' own "up" series carries it too; honor_labels keeps the service's value when both exist.
    honor_labels: true
    static_configs:
      - {targets: ["core:8080"],         labels: {application: ridex-app}}
      - {targets: ["notification:8081"], labels: {application: notification-service}}
      - {targets: ["payment:8082"],      labels: {application: payment-service}}
      - {targets: ["pricing:8083"],      labels: {application: pricing-service}}
      - {targets: ["analytics:8084"],    labels: {application: analytics-service}}
      - {targets: ["gateway:8000"],      labels: {application: api-gateway}}

  - job_name: prometheus          # Prometheus watches itself too
    static_configs:
      - targets: ["localhost:9090"]
