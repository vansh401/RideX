# HORIZONTAL POD AUTOSCALERS: add pods when the average CPU use is above the target, remove them when it falls.
# Needs the metrics-server add-on in the cluster (it measures CPU); without it the autoscaler reports "unknown" and does nothing.
# Only stateless components are autoscaled.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}   # percent of the CPU REQUEST of each pod
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300                         # do not shrink at the first quiet minute
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pricing
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: pricing}
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
