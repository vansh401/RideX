# mailpit: catches every e-mail the app sends (verification codes, password reset) so you can read it in a browser.
# Development only: staging and prod point SPRING_MAIL_HOST at a real mail service instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: ridex
    app.kubernetes.io/component: dev-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: ridex
        app.kubernetes.io/component: dev-tools
    spec:
      serviceAccountName: ridex
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.29
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: web, containerPort: 8025}
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 20
          # The root filesystem is read-only, so the folder where mailpit keeps its mailbox must be a volume
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: ridex
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: web, port: 8025, targetPort: web}
---
# Only the core sends mail
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-to-mailpit
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mailpit}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: core}}
      ports:
        - {port: 1025}
