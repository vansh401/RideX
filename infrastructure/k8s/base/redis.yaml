# redis: tokens with expiry, caches, driver locations (GEO), locks, rate-limit counters, the revocation list.
# A StatefulSet with a small volume so refresh tokens and the driver index survive a restart (Redis writes periodic snapshots to /data).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ridex
    app.kubernetes.io/component: data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: ridex
        app.kubernetes.io/component: data
    spec:
      serviceAccountName: ridex
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # volatile-ttl: when memory is full, Redis may delete only keys that have an expiry. The driver GEO index has none.
          args: [redis-server, --maxmemory, 96mb, --maxmemory-policy, volatile-ttl, --dir, /data]
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 160Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ridex
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
