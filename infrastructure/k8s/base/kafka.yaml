# kafka: one broker that is also its own controller (KRaft mode, no ZooKeeper). Development only; production runs at least three
# brokers (replicas: 3, replication factors 3) or a managed Kafka.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: ridex
    app.kubernetes.io/component: data
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: ridex
        app.kubernetes.io/component: data
    spec:
      serviceAccountName: ridex
      automountServiceAccountToken: false
      # Essential for Kafka: with service links Kubernetes injects KAFKA_PORT=tcp://..., and the Kafka image turns every KAFKA_* variable
      # into broker configuration.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                        # "appuser" of the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports:
            - {name: kafka, containerPort: 9092}
          env:
            # The downward API: the pod learns its own name and namespace, to build the address it tells clients to use.
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            # Kafka tells every client "reach me at THIS address". Inside the cluster the stable name of the pod is
            # <pod>.<service>.<namespace>.svc.cluster.local (this is what the headless Service below provides).
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://$(POD_NAME).kafka.$(POD_NAMESPACE).svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms192m -Xmx384m"}
          resources:
            requests: {cpu: 200m, memory: 400Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: ridex
spec:
  clusterIP: None                              # headless: "kafka-0.kafka" resolves to that exact pod, which Kafka's advertised address needs
  publishNotReadyAddresses: true               # the broker must be reachable by its own name before it counts as ready
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
