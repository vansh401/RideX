# One ServiceAccount for all RideX pods. It has NO permissions (no Role is bound to it), and its token is not mounted into the pods
# (automountServiceAccountToken: false in every pod): nothing here ever needs to talk to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ridex
  labels:
    app.kubernetes.io/part-of: ridex
automountServiceAccountToken: false
