# nginx for the RideX web app.
#
# Two jobs:
#   1. serve the built React files (static hosting), with the fallback a single-page app needs
#   2. forward /api and /ws to the API gateway, so the browser talks to ONE origin (this server). That is the production version of
#      what the Vite proxy does in development: no CORS, one address, the gateway and all services stay hidden.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not tell the world which nginx version this is
    server_tokens off;

    # Compress text. Images and fonts are already compressed.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- the API ---------------------------------------------------------------------------------------------------------
    # "gateway" is the name of the gateway container on the Docker network; Docker's own DNS resolves it.
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        # The gateway reads the real client from this header, but only from us (it trusts this proxy's address). We OVERWRITE
        # whatever the client sent instead of appending to it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # the browser should never cache API answers by accident
        add_header Cache-Control "no-store" always;
    }

    # ---- live updates (WebSocket) ----------------------------------------------------------------------------------------
    location /ws {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;                       # WebSockets need HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;       # pass the "please upgrade this connection" request through
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;                        # a live connection is idle for long stretches
    }

    # ---- static files ----------------------------------------------------------------------------------------------------
    # Vite puts a hash in every built file name (index-3f9a1c.js): a changed file has a new name, so the old one can be cached for ever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the single-page app: serve index.html and let React's router decide. index.html itself must never
    # be cached, or users would keep an old version that points at files that no longer exist.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }

    # Used by the container health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
